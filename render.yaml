services:
  - type: web
    name: engineers-edge
    runtime: node
    plan: free            # free = no persistent disk; files/settings reset on redeploy. Use starter + disk below to keep them.
    buildCommand: npm install --omit=optional
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ALLOW_REMOTE_ADMIN
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false       # Render asks you for this value on first deploy
    # For permanent storage: set plan: starter, then uncomment:
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and add env var STORAGE_DIR=/var/data
